# Po pushi do master: kontrola kódu, testy, build a nahrání na Forpsi (tri-grid.cz).
# Přístup na FTP je v GitHub Secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — údaje z administrace Forpsi.
# Nahrávají se jen změněné soubory; soubory, které z buildu zmizely, se na serveru smažou.
name: Deploy to Forpsi

on:
  push:
    branches: [master]
  workflow_dispatch: # ruční spuštění z karty Actions

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload to Forpsi
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # obyčejné FTP — přihlášení přes FTPS server Forpsi odmítal (530)
          protocol: ftp
          local-dir: ./dist/
          # kořenová složka webu na Forpsi
          server-dir: ./www/
