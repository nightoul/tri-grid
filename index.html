<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Párový skript k public/404.html — rozbalí cestu zakódovanou
      // v query stringu zpět do skutečné URL, ještě než se načte React.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      }(window.location))
    </script>
