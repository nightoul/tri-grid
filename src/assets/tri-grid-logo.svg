<svg viewBox="0 0 460 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tri-Grid">
  <defs>
    <linearGradient id="triGridSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CCBEA" />
      <stop offset="45%" stop-color="#4E86B0" />
      <stop offset="100%" stop-color="#1B3B5C" />
    </linearGradient>
  </defs>

  <!-- Construction: lower-left hexagon and roofline. -->
  <polygon points="140,160 252.6,225 252.6,355 140,420 27.4,355 27.4,225" fill="none" stroke="url(#triGridSteel)" stroke-width="11" stroke-linejoin="round" />
  <path d="M43 310 L105 252 L170 310" fill="none" stroke="url(#triGridSteel)" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" />
  <path d="M72 283 V226" fill="none" stroke="url(#triGridSteel)" stroke-width="11" stroke-linecap="square" />

  <!-- Machinery: lower-right hexagon and radial gear symbol. -->
  <polygon points="320,160 432.6,225 432.6,355 320,420 207.4,355 207.4,225" fill="none" stroke="url(#triGridSteel)" stroke-width="11" stroke-linejoin="round" />
  <circle cx="320" cy="290" r="48" fill="none" stroke="url(#triGridSteel)" stroke-width="11" />
  <g fill="url(#triGridSteel)">
    <rect x="311" y="201" width="18" height="32" />
    <rect x="311" y="201" width="18" height="32" transform="rotate(45 320 290)" />
    <rect x="311" y="201" width="18" height="32" transform="rotate(90 320 290)" />
    <rect x="311" y="201" width="18" height="32" transform="rotate(135 320 290)" />
    <rect x="311" y="201" width="18" height="32" transform="rotate(180 320 290)" />
    <rect x="311" y="201" width="18" height="32" transform="rotate(225 320 290)" />
    <rect x="311" y="201" width="18" height="32" transform="rotate(270 320 290)" />
    <rect x="311" y="201" width="18" height="32" transform="rotate(315 320 290)" />
  </g>

  <!-- Electrical: foreground hexagon and lightning bolt. -->
  <polygon points="230,10 342.6,75 342.6,205 230,270 117.4,205 117.4,75" fill="none" stroke="url(#triGridSteel)" stroke-width="11" stroke-linejoin="round" />
  <polygon points="242.8,52 207.6,148.8 230,148.8 217.2,228 262,122.4 238,122.4 252.4,52" fill="url(#triGridSteel)" />
</svg>
